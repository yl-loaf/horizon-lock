<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Real-time IMU horizon-lock camera stabilisation. Works even when the phone is spinning." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>HorizonLock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Live stabilised view -->
    <canvas id="output"></canvas>

    <!-- Hidden source video + processing canvas -->
    <video id="camera" playsinline muted autoplay style="display:none"></video>
    <canvas id="process" style="display:none"></canvas>

    <!-- UI Overlay -->
    <div id="ui">
      <header>
        <button id="btn-flip" class="icon-btn" title="Switch camera">⟳</button>
        <div id="status">
          <span id="rec-indicator"></span>
          <span id="zoom-label">1.7×</span>
        </div>
      </header>

      <div id="permission-gate" class="gate">
        <h1>HorizonLock</h1>
        <p>Real-time horizon lock using your phone’s IMU.<br>Keeps the image level even when spinning.</p>
        <button id="btn-start" class="primary">Enable Camera &amp; Motion</button>
        <p class="hint">Requires HTTPS and iOS 13+ / modern Chrome. Add to Home Screen for best experience.</p>
      </div>

      <footer id="controls" style="display:none">
        <div class="slider-row">
          <span>−</span>
          <input type="range" id="zoom" min="1.3" max="2.4" step="0.05" value="1.7" />
          <span>+</span>
        </div>
        <button id="btn-record" class="record-btn"></button>
        <p class="hint">Fixed digital zoom prevents FOV pumping while spinning</p>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
